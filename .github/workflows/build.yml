name: Build Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: assembleRelease (arm64-v8a)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TERMUX_ARCH: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1'
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          mkdir -p "${ANDROID_HOME}/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "${ANDROID_HOME}/licenses/android-sdk-license"
          echo "84835b9432ad3f54316d2516422849880f08a478" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Fetch PRoot binaries (proot + libtalloc) for arm64-v8a
        shell: bash
        run: ./scripts/fetch-proot-binaries.sh
      - name: Verify PRoot binaries are present
        shell: bash
        run: |
          set -euo pipefail
          for f in libproot.so libprootloader.so libtalloc.so libandroid-shmem.so; do
            path="app/src/main/jniLibs/arm64-v8a/$f"
            if [ ! -s "$path" ]; then
              echo "ERROR: $path missing or empty"
              exit 1
            fi
            echo "$f: $(wc -c < "$path") bytes"
          done
      - name: Detect signing keystore
        id: has_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Decode signing keystore
        if: steps.has_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
      - name: Build release APK (lite flavor only)
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/keystore/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          ./gradlew :app:assembleLiteRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.builder.sdkDownload=false
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-arm64-release
          path: app/build/outputs/apk/lite/release/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches versionName
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          version_name=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName = "//;s/".*//')
          echo "Tag: $tag"
          echo "versionName: $version_name"
          if [ "$tag" != "$version_name" ]; then
            echo "ERROR: git tag (v$tag) does not match versionName ($version_name)"
            exit 1
          fi
          echo "✓ Version matches"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: hermes-agent-arm64-release
          path: artifacts

      - name: Rename APK with tag version
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          apk=$(find . -name '*.apk' | head -n1)
          tag="${GITHUB_REF#refs/tags/}"
          new_name="hermes-${tag}-arm64-lite.apk"
          cp "$apk" "$new_name"
          rm -f "$apk"
          echo "Renamed to: $new_name ($(du -h "$new_name" | cut -f1))"

      - name: Generate SHA256 checksum
        id: sha256
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          apk=$(find . -name '*.apk' | head -n1)
          sha256sum "$apk" > "${apk}.sha256"
          hash=$(awk '{print $1}' "${apk}.sha256")
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Generated ${apk}.sha256:"
          cat "${apk}.sha256"

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag"

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          # tag 形如 v0.0.2，CHANGELOG.md 里对应 "## [v0.0.2]"
          # 注意：awk 中 [v0.0.2] 会被当作字符类，必须用 index() 做字符串匹配
          changelog=$(awk -v tag="## [${tag}]" '
            index($0, tag) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/^---$/d' | sed '/./,$!d')
          if [ -z "$changelog" ]; then
            changelog="（CHANGELOG.md 中未找到 ${tag} 的更新日志）"
          fi
          # 判断是否为测试版：
          # 1. CHANGELOG 中包含"测试版"，或
          # 2. git tag 中包含 "beta"（如 v0.0.2-beta）
          is_prerelease="false"
          if echo "$changelog" | grep -q "测试版" || echo "${GITHUB_REF#refs/tags/}" | grep -qi "beta"; then
            is_prerelease="true"
          fi
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          # 转义为 GITHUB_OUTPUT 多行格式
          {
            echo "body<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Extracted changelog (${#changelog} chars, prerelease=$is_prerelease)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.apk
            artifacts/*.apk.sha256
          name: Hermes Agent (Android) ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.changelog.outputs.is_prerelease }}
          body: |
            ## ${{ steps.version.outputs.version }}

            ${{ steps.changelog.outputs.body }}

            ---

            ### 下载

            | 文件 | 说明 |
            |------|------|
            | `hermes-${{ steps.version.outputs.version }}-arm64-lite.apk` | Lite 版本，首次启动自动下载依赖（~1GB） |
            | `hermes-${{ steps.version.outputs.version }}-arm64-lite.apk.sha256` | SHA256 校验值 |

            ### 校验值 (SHA256)

            ```
            ${{ steps.sha256.outputs.hash }}  hermes-${{ steps.version.outputs.version }}-arm64-lite.apk
            ```

            ### 系统要求

            - Android 10+（arm64-v8a）
            - 首次启动需联网下载约 1GB 依赖
            - 建议预留 3GB+ 存储空间

            ### 安装

            下载 APK 后直接安装，或通过 adb：
            ```
            adb install hermes-${{ steps.version.outputs.version }}-arm64-lite.apk
            ```

            ### 首次启动

            打开应用 → 点击"一键安装" → 等待 4 步骤完成（proot / 依赖 / Hermes Agent / WebUI）→ 进入仪表盘

            [完整更新日志](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
          fail_on_unmatched_files: true
